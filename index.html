<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">

<style>

    --card:#faf3b8; --accent:#0ea79a; --accent-bg:#d3f3ec;
    --warn:#e2643c; --warn-bg:#ffe9e0;
  }
  .cannot-select,
  #errorDialog {
    -webkit-user-select: none;
    user-select: none;
  }
  *{box-sizing:border-box;}
  img.emoji{height:1em; width:1em; margin:0 .05em 0 .1em; vertical-align:-0.05em;}
  body{
    margin:0; padding:44px 20px 60px; color:var(--ink);
    font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg, #167e93 0%, #3fb8c4 50%, #8fe8d8 100%);
    position:relative;
    overflow-x:hidden;
    display:flex; justify-content:center;
  }
  body::before, body::after{
    content:''; position:fixed; border-radius:50%; pointer-events:none; z-index:0;
    background:
      radial-gradient(circle, transparent 53%, rgba(255,255,255,0.14) 57%, rgba(255,255,255,0.14) 61%, transparent 65%),
      radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 45%, transparent 72%);
  }
  body::before{
    width:300px; height:300px;
    top:-50px; right:-50px;
  }
  body::after{
    width:220px; height:220px;
    bottom:-30px; left:-30px;
  }
  .page{
    position:relative; z-index:1; width:100%; max-width:1400px;
  }
  .hero{
    text-align:center; margin-bottom:26px;
  }
  .hero .badge{
    display:inline-block; font-size:34px; margin-bottom:6px;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,0.15));
  }
  .hero h1{
    position:relative;
    font-size:42px; font-weight:900; margin:0 0 4px; color:#fdf3ba;
    text-shadow:3px 3px 0 #142a4d, 3px 3px 6px rgba(20,42,77,0.3);
  }
  .title-icon{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:130px; height:130px; z-index:-1; opacity:0.32; pointer-events:none;
  }
  .hero .sub{color:rgba(255,255,255,0.9); font-size:13px; margin:0;}
  .footer-reset{

    color:rgba(255,255,255,0.35); cursor:pointer;
  }
  .footer-reset:hover{color:rgba(255,255,255,0.6);}

    background:var(--card); border-radius:28px; padding:26px 20px 30px;
    border:3px solid var(--ink);
    box-shadow:0 8px 0 var(--ink), 0 20px 46px rgba(6,50,45,0.28);

  }
  .toolbar .dropdown-toggle{

  .toolbar .dropdown-toggle::after{
    content:''; position:absolute; right:15px; top:50%;

    th.item, td.item{display:none;}
  }

  .dropdown-menu.open{display:block;}

    font-weight:600; color:var(--ink); cursor:pointer; white-space:nowrap;
  }

  @keyframes dinoJump{

  .week-nav{

    border:1.5px solid rgba(255,255,255,0.6);
    box-shadow: inset 0 0 4px rgba(255,255,255,0.25);
  }

</style>

<div id="bubbleLayer"></div>
<script>
  // 氣泡數量控制：改這個數字就能增加或減少氣泡總數
  const BUBBLE_COUNT = 35;
  // 氣泡上升速度控制 (px/秒)，每顆氣泡會在這個範圍內隨機挑一個速度
  const BUBBLE_RISE_SPEED_MIN = 30; // 最慢的上升速度
  const BUBBLE_RISE_SPEED_MAX = 50; // 最快的上升速度

  function getRandomArbitrary(min, max){
    return Math.random() * (max - min) + min;
  }

  function getOrCreateBubbleCSSElement(){
    let el = document.getElementById('bubble-css');
    if(el) return el;
    el = document.createElement('style');
    el.id = 'bubble-css';
    document.head.appendChild(el);
    return el;
  }

  function createBubbles(count){
    const layer = document.getElementById('bubbleLayer');
    const fragment = document.createDocumentFragment();
    let cssRule = '';

    for(let i = 0; i < count; i++){
      const el = document.createElement('div');
      el.className = 'bubble-particle bubble-' + i;

      const size = getRandomArbitrary(12, 30); // 12px ~ 30px
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      fragment.appendChild(el);

      const startX = Math.random() * 100;       // 起始水平位置 (vw)
      const drift = getRandomArbitrary(-8, 8);   // 上升過程中左右飄移的幅度 (vw)
      const midX = drift * 0.5;
      const speed = getRandomArbitrary(BUBBLE_RISE_SPEED_MIN, BUBBLE_RISE_SPEED_MAX); // px/秒
      const duration = ((window.innerHeight * 1.15) / speed).toFixed(2);   // 依速度換算成這一輪上升花費的時間
      const delay = (Math.random() * duration * -1).toFixed(2); // 負延遲：一開始就散布在半空中，不會同時從底部冒出
      const opacity = getRandomArbitrary(0.25, 0.6).toFixed(2);

      cssRule += `
        .bubble-${i}{
          left:${startX}vw;
          opacity:${opacity};
          animation: bubble-rise-${i} ${duration}s ${delay}s linear infinite;
        }
        @keyframes bubble-rise-${i}{
          0%{ transform: translate(0, 0); }
          50%{ transform: translate(${midX}vw, -55vh); }
          100%{ transform: translate(${drift}vw, -115vh); }
        }
      `;
    }

    layer.appendChild(fragment);
    getOrCreateBubbleCSSElement().innerHTML = cssRule;
  }

  createBubbles(BUBBLE_COUNT);
</script>

<script>
const WEEK = ["日","月","火","水","木","金","土"];
let tasks = [];

function parseEmoji(el){
  if(window.twemoji) twemoji.parse(el); // Twemoji 載入失敗時就維持原生 emoji，不中斷程式
}

let dinoJumpTimer = null, dinoEscapeTimer = null;
function stopDinoEscape(){
  clearTimeout(dinoJumpTimer);
  clearTimeout(dinoEscapeTimer);
}
function showErrorDialog(message, icon = '😰'){
  document.getElementById('errorDialogMsg').innerHTML = message;
  const iconEl = document.querySelector('#errorDialog .error-icon');
  stopDinoEscape();
  iconEl.classList.remove('dino-jump', 'dino-escape');
  iconEl.style.animationDuration = '';
  iconEl.textContent = icon;
  iconEl.classList.toggle('flip-x', icon === '🦖');
  parseEmoji(iconEl);
  document.getElementById('errorDialog').showModal();
  if(icon === '🦖'){
    dinoJumpTimer = setTimeout(()=>{
      iconEl.classList.add('dino-jump');
      dinoEscapeTimer = setTimeout(()=>{
        iconEl.classList.remove('dino-jump');
        const speedPxPerSec = 400; // 固定速度，螢幕越寬時長越長，速度不變
        const distancePx = window.innerWidth * 1.5;
        iconEl.style.animationDuration = (distancePx / speedPxPerSec) + 's';
        iconEl.classList.add('dino-escape');
      }, 500);
    }, 5000);
  }
}
document.getElementById('errorDialogClose').onclick = ()=>{
  stopDinoEscape();
  document.getElementById('errorDialog').close();
};

}

const POP_BUBBLE_COUNT = 8;       // 打勾時噴出的氣泡數量，改這個數字就能增加或減少
// 打勾氣泡最後往上飄的速度 (px/秒)，每顆會在這個範圍內隨機挑一個速度
const POP_BUBBLE_RISE_SPEED_MIN = 30; // 最慢的上升速度
const POP_BUBBLE_RISE_SPEED_MAX = 55; // 最快的上升速度

function burstBubblePop(x, y){
  for(let i=0; i<POP_BUBBLE_COUNT; i++){
    const el = document.createElement('div');
    el.className = 'pop-bubble';
    const size = 4 + Math.random()*5; // 比背景氣泡（12~30px）小很多
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.left = x + 'px';
    el.style.top = y + 'px';

    const angle = Math.random()*Math.PI*2;
    const burstDist = 18 + Math.random()*22; // 噴出（拋物線四散）的距離
    const bx = Math.cos(angle)*burstDist;
    const by = Math.sin(angle)*burstDist;
    el.style.setProperty('--bx', bx+'px');
    el.style.setProperty('--by', by+'px');
    document.body.appendChild(el);

    setTimeout(()=>{ // 噴出動畫(320ms) + 停留(150ms) 後，換成往上飄
      el.style.animation = 'none';
      el.style.transform = `translate(-50%,-50%) translate(${bx}px, ${by}px) scale(1)`;
      void el.offsetHeight; // 強制瀏覽器先套用上面這個狀態，避免下面的轉場動畫被跳過
      const riseDistance = 60 + Math.random()*50; // 往上飄的距離
      const sway = (Math.random()-0.5)*30; // 左右飄移，跟背景氣泡一樣的感覺
      const speed = getRandomArbitrary(POP_BUBBLE_RISE_SPEED_MIN, POP_BUBBLE_RISE_SPEED_MAX);
      const riseDuration = riseDistance / speed;
      const fadeDuration = riseDuration * 0.45;
      const fadeDelay = riseDuration * 0.55;
      el.style.transition = `transform ${riseDuration}s ease-in, opacity ${fadeDuration}s ease-in ${fadeDelay}s`;
      el.style.transform = `translate(-50%,-50%) translate(${bx+sway}px, ${by-riseDistance}px) scale(0.85)`;
      el.style.opacity = '0';
      setTimeout(()=>el.remove(), riseDuration*1000 + 500);
    }, 470);
  }
}

const FISH_WEIGHTS = [
  ['🐟', 39.5],
  ['🐠', 24],
  ['🐡', 9],
  ['🦈', 9],
  ['🐢', 9],
  ['🦐', 9],
  ['🦖', 0.5], // 隱藏版
];
function pickFishEmoji(){
  const r = Math.random()*100;
  let cumulative = 0;
  for(const [emoji, weight] of FISH_WEIGHTS){
    cumulative += weight;
    if(r < cumulative) return emoji;
  }
  return FISH_WEIGHTS[0][0];
}

function celebrateFish(){
  const parade = document.createElement('div');
  parade.className = 'fish-parade';

  for(let i=0; i<count; i++){
    const f = document.createElement('span');

}

function checksKey(y,m){ return `${y}-${String(m+1).padStart(2,'0')}`; }

function isWeekend(y,m,d){
  const wd = new Date(y,m,d).getDay();
  return wd===0 || wd===6;
}

function isPastDay(y,m,d){
  const target = new Date(y,m,d);
  target.setHours(0,0,0,0);
  const now = new Date();
  now.setHours(0,0,0,0);
  return target < now;
}

async function loadChecksForKey(key){
  try{
    const res = await fetch(`/api/checks/${key}`);
    if(!res.ok) throw new Error('status ' + res.status);
    checksByMonth[key] = await res.json();
  }catch(e){
    console.error('読み込みに失敗しました', e);
    checksByMonth[key] = {};
    showErrorDialog('データの読み込みに失敗しました。<br>ネットワーク接続を確認して<br>再度お試しください。', '🦖');
  }
}

// 指定した年月のデータがまだ無ければ読み込む（複数月にまたがる週表示用）
async function ensureChecksLoaded(y,m){
  const key = checksKey(y,m);
  if(checksByMonth[key]) return;
  await loadChecksForKey(key);
}

async function saveCheck(docKey, fieldKey, value){
  try{
    const res = await fetch(`/api/checks/${docKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fieldKey, value }),
    });
    if(!res.ok) throw new Error('status ' + res.status);
  }catch(e){
    console.error('保存に失敗しました', e);
    showErrorDialog('保存に失敗しました。<br>ネットワーク接続を確認して<br>再度お試しください。', '🦖');

  document.getElementById('weekNextBtn').onclick = ()=> shiftWeek(7);

function renderStats(){
  const nd = daysInMonth(year, month);
  const checks = getChecksForMonth(year, month);
  let total = 0, done = 0;
  tasks.forEach(t=>{
    for(let d=1; d<=nd; d++){
      if(isWeekend(year,month,d)) continue; // 土日は統計に含めない
      total++;
      if(checks[t.id+'-'+d]) done++;
    }
  });
  const todayObj = new Date();
  const isToday = todayObj.getFullYear()===year && todayObj.getMonth()===month;
  const todayIsWeekend = isToday && isWeekend(year,month,todayObj.getDate());
  let todayDone = 0, todayTotal = tasks.length;
  if(isToday && !todayIsWeekend){
    tasks.forEach(t=>{ if(checks[t.id+'-'+todayObj.getDate()]) todayDone++; });
  }
  const rate = total ? Math.round(done/total*100) : 0;
  const todayLabel = (isToday && todayIsWeekend) ? '本日休み（土日）' : '本日の完了';
  const todayValue = (isToday && todayIsWeekend) ? '—' : `${todayDone} / ${todayTotal}`;
  const box = document.getElementById('statsBox');
  box.innerHTML = `
    <div class="stat-card"><div class="num">${rate}%</div><div class="label">今月の完了率</div></div>
    <div class="stat-card"><div class="num">${done} / ${total}</div><div class="label">今月の完了数 / 全項目数</div></div>
    <div class="stat-card"><div class="num">${todayValue}</div><div class="label">${todayLabel}</div></div>
  `;
  if(rate === 100 && lastRate !== 100) celebrateFish();
  lastRate = rate;
}

function buildTaskRow(t, columns, todayY, todayM, todayD){
  const tr = document.createElement('tr');

  const mainTd = document.createElement('td');
  mainTd.className = 'rowlabel pinnable';
  mainTd.textContent = t.main;
  mainTd.title = 'クリックすると次回からこの担当の項目が一番上に表示されます';
  mainTd.onclick = ()=>{
    setPinnedPerson(extractName(t.main));
    render();
  };
  tr.appendChild(mainTd);

  const proxyTd = document.createElement('td');
  proxyTd.className = 'rowlabel proxy';
  proxyTd.textContent = t.proxy || '';
  tr.appendChild(proxyTd);

  const itemTd = document.createElement('td');
  itemTd.className = 'rowlabel item';
  itemTd.appendChild(document.createTextNode(t.item));
  if(t.desc){
    const hint = document.createElement('span');
    hint.className = 'desc-hint';
    hint.textContent = '?';
    hint.dataset.tip = t.desc;
    itemTd.appendChild(hint);
  }
  tr.appendChild(itemTd);

  columns.forEach(col=>{
    const weekend = col.weekend;
    const isToday = col.y===todayY && col.m===todayM && col.d===todayD;
    const cellTd = document.createElement('td');
    cellTd.className = 'cell' + (weekend ? ' weekend-col' : '') + (isToday && !weekend ? ' today-col' : '');
    const docKey = checksKey(col.y, col.m);
    const key = t.id+'-'+col.d;
    const checks = getChecksForMonth(col.y, col.m);
    const box = document.createElement('div');

    if(weekend){
      box.className = 'check offday';
      cellTd.appendChild(box);
      cellTd.title = '土日は休みです';
      // 土日はクリック不可
    }else{
      const overdue = !checks[key] && isPastDay(col.y, col.m, col.d);
      box.className = 'check' + (checks[key] ? ' done' : '') + (overdue ? ' overdue' : '');
      box.textContent = checks[key] ? '😊' : '';
      cellTd.appendChild(box);
      cellTd.onclick = async ()=>{
        checks[key] = !checks[key];
        checksByMonth[docKey] = checks;
        box.classList.toggle('done', !!checks[key]);
        box.classList.toggle('overdue', !checks[key] && isPastDay(col.y, col.m, col.d));
        box.textContent = checks[key] ? '😊' : '';
        parseEmoji(box);
        if(checks[key]){
          const r = cellTd.getBoundingClientRect();
          burstBubblePop(r.left + r.width/2, r.top + r.height/2);
        }
        renderStats();
        await saveCheck(docKey, key, checks[key]);
      };
    }
    tr.appendChild(cellTd);
  });
  return tr;
}

document.getElementById('todayBtn').onclick = async ()=>{
  const now = new Date();
  const sameMonth = (year === now.getFullYear() && month === now.getMonth());
  const sameWeek = weekStart && +weekStart === +startOfWeekMonday(now);
  if(sameMonth && sameWeek) return;
  year = now.getFullYear(); month = now.getMonth();
  weekStart = startOfWeekMonday(now);
  setYearUI(year);
  setMonthUI(month);
  showLoadingOverlay();
  await loadChecks(year, month);
  render();
  hideLoadingOverlay();
};

document.getElementById('footerReset').onclick = ()=>{
  clearPinned();
  render();
};

async function init(){
  celebrateFish();
  const now = new Date();
  year = now.getFullYear(); month = now.getMonth();
  weekStart = startOfWeekMonday(now);
  loadTasks();
  buildSelectors();
  render();
  await loadChecks(year, month);
  hideLoadingOverlay();
  render();
}
init();
</script>
